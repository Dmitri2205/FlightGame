name: Build, test & deploy

# main — собрать, прогнать smoke test и выложить на GitHub Pages.
# Pull request — только собрать и прогнать smoke test (без публикации),
# чтобы проверить изменения до слияния в main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Свой поток на каждую ветку/PR: сборки разных веток больше не отменяют
# друг друга. Сборку main не прерываем, чтобы не оборвать публикацию.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          tpl_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl_dir"
          unzip -q templates.tpz
          mv templates/* "$tpl_dir/"
          rm -rf godot.zip templates.tpz templates

      - name: Import project
        run: godot --headless --import || godot --headless --editor --quit

      # Прогоняем сцены и падаем, если в логе есть ошибки скриптов.
      # --fixed-fps 60: каждый кадр = 1/60 с игрового времени, поэтому
      # N кадров = N/60 секунд игры независимо от скорости раннера.
      - name: Smoke test
        run: |
          status=0
          run() {
            name="$1"; shift
            echo "::group::$name"
            godot --headless --path . --fixed-fps 60 "$@" 2>&1 | tee run.log
            local code=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$code" -ne 0 ] || grep -qE "SCRIPT ERROR|Parse Error|ERROR:" run.log; then
              echo "::error::Ошибки: $name"
              status=1
            fi
          }
          run "data validation" --script res://tests/validate_data.gd || status=1
          for scene in scenes/ui/main_menu.tscn scenes/ui/upgrade_menu.tscn scenes/ui/ship_select.tscn scenes/ui/level_map.tscn scenes/ui/wave_preview.tscn; do
            run "$scene" "res://$scene" --quit-after 300
          done
          # Каждый уровень каждой главы — по 15 с игрового времени.
          for chapter in 0 1 2; do
            for level in 0 1 2 3; do
              run "level $chapter:$level (15s)" res://scenes/game/level.tscn --quit-after 900 -- --level=$chapter:$level
            done
          done
          run "all flight patterns (25s)" res://scenes/game/level.tscn --quit-after 1500 -- --patterns
          run "boss fight (20s)" res://scenes/game/level.tscn --quit-after 1200 -- --boss
          exit $status

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.html

      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
